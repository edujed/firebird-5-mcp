name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux + Windows (amd64/arm64) ──────────────────────────────────
  build-linux-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: firebird-5-mcp-linux-amd64
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: firebird-5-mcp-linux-arm64
            ext: ""
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            name: firebird-5-mcp-windows-amd64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cross-compile toolchains
      - name: Install aarch64-linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Install mingw-w64 (Windows cross)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64-x86-64-dev mingw-w64-x86-64-tools

      - name: Build
        env:
          # O rustc usa rust-lld por padrão, que não suporta flags AArch64
          # em host x86_64. Forçamos o gcc cross como linker.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cd firebird-5-mcp
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          # Extract version from tag: v1.1.0 → 1.1.0
          VERSION="${GITHUB_REF#refs/tags/v}"
          mkdir -p dist
          src="firebird-5-mcp/target/${{ matrix.target }}/release/firebird-5-mcp${{ matrix.ext }}"
          base="${{ matrix.name }}-${VERSION}"
          cp "$src" "dist/${base}${{ matrix.ext }}"

          # Include documentation in the archive
          cp README.md README-PTBR.md CHANGELOG.md LICENSE dist/

          if [[ "${{ matrix.ext }}" == ".exe" ]]; then
            (cd dist && zip -q "${base}.zip" "${base}${{ matrix.ext }}" README.md README-PTBR.md CHANGELOG.md LICENSE)
            rm "dist/${base}${{ matrix.ext }}"
          else
            (cd dist && tar czf "${base}.tar.gz" "${base}${{ matrix.ext }}" README.md README-PTBR.md CHANGELOG.md LICENSE)
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.name }}-*.tar.gz
            dist/${{ matrix.name }}-*.zip
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS (amd64 + arm64) ──────────────────────────────────────────
  # Cross-compile para macOS exige osxcross (não disponível no runner).
  # Usamos runners macOS nativos: cada job compila para a própria arch.
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: x86_64-apple-darwin
            name: firebird-5-mcp-darwin-amd64
          - os: macos-15
            target: aarch64-apple-darwin
            name: firebird-5-mcp-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cd firebird-5-mcp
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          mkdir -p dist
          base="${{ matrix.name }}-${VERSION}"
          cp "firebird-5-mcp/target/${{ matrix.target }}/release/firebird-5-mcp" \
             "dist/${base}"
          cp README.md README-PTBR.md CHANGELOG.md LICENSE dist/
          (cd dist && tar czf "${base}.tar.gz" "${base}" README.md README-PTBR.md CHANGELOG.md LICENSE)

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.name }}-*.tar.gz
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
