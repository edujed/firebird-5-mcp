[workspace]
resolver = "2"
members = ["crates/mcp-core", "crates/mcp-bin"]

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "MIT"
authors = [ "Eduardo Jedliczka <edujed@gmail.com>"]
repository = "https://github.com/edujed/jed-personal-mcp"
description = "Pure-Rust MCP server for Firebird databases (no isql, no native libs)"

[workspace.dependencies]
# Driver do Firebird em Rust Puro (sem dependência de DLL/.so)
rsfbclient = { version = "0.29.0", default-features = false, features = ["pure_rust"] }
rsfbclient-rust = "0.29.0"
rsfbclient-core = "0.29.0"

# Serialização ultra rápida de JSON para o protocolo MCP
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Datas/horas (tipos DATE/TIME/TIMESTAMP do Firebird)
chrono = "0.4"

# Async Runtime padrão ouro para a rede e entrada/saída
tokio = { version = "1.0", features = ["full"] }

# Servidor Web leve para a Web-UI
axum = { version = "0.7", features = ["macros"] }

[profile.release]
opt-level = 3            # Máxima otimização
codegen-units = 1         # Melhor codegen (mais lento build, melhor runtime)
lto = "fat"              # Link-time optimization agressivo
panic = "abort"           # Menor binário (sem unwinding)
strip = true              # Remove símbolos do binário
debug = false             # Sem debug info
